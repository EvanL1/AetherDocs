name = "docs"
main = "worker/entry.js"
compatibility_date = "2026-07-11"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

# docs.aetheriot.dev stays bound so the worker can answer its requests with a
# permanent redirect to the product domain. Removing it would break every
# published link and every agent that fetched llms.txt from the old origin.
routes = [
  { pattern = "docs.aetheriot.ai", custom_domain = true },
  { pattern = "docs.aetheriot.dev", custom_domain = true }
]
